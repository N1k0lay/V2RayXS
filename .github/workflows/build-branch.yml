name: build branch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build V2RayXS (arm64)
        run: bash build.sh arm64

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: V2RayXS-arm64
          path: build/out/V2RayXS_arm64.app.zip
          if-no-files-found: error
